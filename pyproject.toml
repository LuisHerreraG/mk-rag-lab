[project]
name = "mk-rag-lab"
version = "0.1.0"
description = "RAG over a document corpus with Azure OpenAI + Azure AI Search, evaluated."
requires-python = ">=3.12"
dependencies = [
    "azure-search-documents>=11.6.0",
    "openai>=1.60",
    "tiktoken>=0.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
mk-rag-ingest = "mk_rag_lab.ingest:main"
mk-rag-search = "mk_rag_lab.search:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mk_rag_lab"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
