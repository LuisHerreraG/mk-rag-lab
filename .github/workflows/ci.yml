name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install (incluye el extra dev, donde viven ruff y pytest)
        run: uv sync --frozen --extra dev || uv sync --extra dev
      - name: lint
        run: uv run ruff check src eval scripts
      - name: import + schema
        run: uv run python -c "from mk_rag_lab.schema import build_index; ix=build_index('t'); print(ix.name, len(ix.fields))"
      - name: tests
        run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build (arm64 + amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
